apiVersion: agent/v1
kind: AgentSpec
metadata:
  name: GraphRAG SurrealDB Claude SDK Demo
  id: graphrag_surrealdb_claude_sdk_demo
  namespace: demo
  version: 1.0.0
  level: genies
  description: >
    GraphRAG demo using SurrealDB graph traversal + vector search, compiled with Claude Agent SDK.
    Demonstrates multi-hop graph expansion from vector seed results across entity relationships.
  author: SuperOptiX
  tags:
    - surrealdb
    - graphrag
    - graph
    - claude
    - demo

spec:
  target_framework: claude_sdk

  language_model:
    location: local
    provider: ollama
    model: ollama:qwen3.5:9b
    api_base: http://localhost:11434
    temperature: 0.2
    max_tokens: 1800

  input_fields:
    - name: knowledge_query
      type: str
      description: Query to answer using GraphRAG context (vector search + graph traversal).
      required: true

  output_fields:
    - name: retrieved_response
      type: str
      description: Response grounded in both direct and graph-expanded retrieved knowledge.
      required: true

  persona:
    name: GraphRAGClaudeAssistant
    role: SurrealDB GraphRAG Claude Analyst
    goal: >
      Retrieve relevant context from SurrealDB using GraphRAG (vector search + graph traversal)
      and provide answers that reflect both direct matches and graph-discovered related entities.
    traits:
      - grounded
      - graph-aware
      - thorough

  tasks:
    - name: analyze_with_graphrag
      instruction: >
        Analyze the query using GraphRAG context retrieved from SurrealDB.
        The context includes both directly similar documents and entities
        discovered by traversing graph relationships (RELATE edges).
        Answer in a way that reflects this richer, connected knowledge.
      inputs:
        - name: knowledge_query
          type: str
          description: User query
          required: true
      outputs:
        - name: retrieved_response
          type: str
          description: Final grounded answer using graph-expanded context

  rag:
    enabled: true
    retriever_type: surrealdb
    config:
      top_k: 5
      retrieval_mode: graph        # Graph traversal + vector search
      graph_depth: 2               # Follow edges up to 2 hops
      graph_relations:             # Edge types to traverse
        - integrates_with
        - provides
        - supports
        - enables
      chunk_size: 512
      chunk_overlap: 50
      similarity_threshold: 0.60
      hybrid_alpha: 0.7
    vector_store:
      embedding_model: sentence-transformers/all-MiniLM-L6-v2
      url: ws://localhost:8000
      namespace: superoptix
      database: knowledge
      username: root
      password: secret
      skip_signin: false
      table_name: rag_documents
      vector_field: embedding
      content_field: content
      metadata_field: metadata

  feature_specifications:
    scenarios:
      - name: graph_entity_traversal
        description: >
          Verify GraphRAG expands from a query about SurrealDB to discover
          related capabilities via RELATE edges.
        input:
          knowledge_query: What capabilities does SurrealDB provide?
        expected_output:
          retrieved_response: graph traversal context expanded

      - name: platform_discovery
        description: >
          Verify graph traversal surfaces SuperOptiX from a query about RAG tools.
        input:
          knowledge_query: What tools support RAG?
        expected_output:
          retrieved_response: superoptix integration found

# Quick Start:
#   # 1. Start SurrealDB:
#   docker run --rm -p 8000:8000 surrealdb/surrealdb:latest start --user root --pass secret
#
#   # 2. Seed graph data:
#   python superoptix/agents/demo/setup_surrealdb_seed.py \
#     --playbook superoptix/agents/demo/graphrag_surrealdb_claude_sdk_demo_playbook.yaml \
#     --graph
#
#   # 3. Compile and run:
#   super agent compile graphrag_surrealdb_claude_sdk_demo --framework claude_sdk
#   super agent run graphrag_surrealdb_claude_sdk_demo --framework claude_sdk \
#     --goal "What capabilities does SurrealDB provide?"
