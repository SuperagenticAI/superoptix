apiVersion: agent/v1
kind: AgentSpec
metadata:
  name: RAG SurrealDB DeepAgents Demo
  id: rag_surrealdb_deepagents_demo
  namespace: demo
  version: 1.0.0
  level: genies
  description: SurrealDB-backed RAG demo compiled with DeepAgents.
  author: SuperOptiX
  tags:
    - surrealdb
    - rag
    - deepagents
    - demo

spec:
  target_framework: deepagents

  language_model:
    location: cloud
    provider: anthropic
    model: claude-sonnet-4-20250514
    temperature: 0.2
    max_tokens: 1800

  input_fields:
    - name: knowledge_query
      type: str
      description: Query to answer using retrieved SurrealDB context.
      required: true

  output_fields:
    - name: retrieved_response
      type: str
      description: Response grounded in retrieved knowledge.
      required: true

  persona:
    name: SurrealDBDeepAgentsAssistant
    role: SurrealDB RAG DeepAgents Analyst
    goal: Retrieve relevant context from SurrealDB and answer clearly.
    backstory: >
      You are a DeepAgents assistant that prioritizes grounded retrieval before
      generating responses.
    traits:
      - grounded
      - concise
      - practical

  tasks:
    - name: analyze_with_retrieval
      instruction: Analyze the query and answer using SurrealDB retrieved context.
      inputs:
        - name: knowledge_query
          type: str
          description: User query
          required: true
      outputs:
        - name: retrieved_response
          type: str
          description: Final grounded answer

  rag:
    enabled: true
    retriever_type: turboagents-surrealdb
    config:
      top_k: 5
      chunk_size: 512
      chunk_overlap: 50
      similarity_threshold: 0.65
    vector_store:
      embedding_model: sentence-transformers/all-MiniLM-L6-v2
      embedding_dimension: 64
      bits: 3.5
      rerank_top: 16
      url: ws://localhost:8000
      namespace: superoptix
      database: knowledge
      username: root
      password: secret
      skip_signin: false
      table_name: rag_documents
      vector_field: embedding
      content_field: content
      metadata_field: metadata

  feature_specifications:
    scenarios:
      - name: token_retrieval
        description: Ensure retrieval includes seeded demo token.
        input:
          knowledge_query: What is NEON-FOX-742?
        expected_output:
          retrieved_response: token retrieval success

# Quick Start:
#   super agent pull rag_surrealdb_deepagents_demo
#   export ANTHROPIC_API_KEY=your_key
#   super agent compile rag_surrealdb_deepagents_demo --framework deepagents --cloud --provider anthropic --model claude-sonnet-4-20250514
#   super agent run rag_surrealdb_deepagents_demo --framework deepagents --cloud --provider anthropic --model claude-sonnet-4-20250514 --goal "What is NEON-FOX-742?"
