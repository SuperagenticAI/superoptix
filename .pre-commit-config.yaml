# Mirrors the gating checks in .github/workflows/ci.yml and release.yml, so a
# commit that passes locally passes in CI.
#
#   pre-commit install --install-hooks
#
# Lint, formatting and release metadata run on commit. Tests are not hooked:
# they belong in CI on a pull request, where a failure can be read and fixed
# without standing between you and a push.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # CI runs `ruff check .` and `ruff format --check .`. This replaces the black
  # and flake8 hooks that were here: black and ruff-format disagree on output,
  # so the previous config reformatted files into a state CI then rejected.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # release.yml runs this against the tag. Running it whenever a
      # version-carrying file changes catches a stale uv.lock or a missing
      # changelog heading at commit time instead of halfway through a release,
      # where the version number has already been spent.
      - id: release-metadata
        name: release metadata is consistent
        entry: python scripts/check_release_metadata.py
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|CHANGELOG\.md|superoptix/__init__\.py)$
