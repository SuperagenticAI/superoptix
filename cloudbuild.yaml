# Cloud Run continuous deploy from GitHub (tag pushes).
#
# Autodetect finds Dockerfile and builds with a user-managed service account.
# That account cannot write the Google-owned logs bucket, which fails with:
#
#   if 'build.service_account' is specified, the build must either
#   (a) specify 'build.logs_bucket', (b) REGIONAL_USER_OWNED_BUCKET, or
#   (c) CLOUD_LOGGING_ONLY / NONE
#
# This file is preferred over Dockerfile when Type is Autodetected. Also
# uncheck "Send build logs to GitHub" on the trigger (that path uses GCS).

substitutions:
  _SERVICE_NAME: superoptix-a2a
  _DEPLOY_REGION: europe-west1
  _AR_HOSTNAME: ${_DEPLOY_REGION}-docker.pkg.dev
  _AR_REPOSITORY: cloud-run-source-deploy

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}
      - -f
      - Dockerfile
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ${_SERVICE_NAME}
      - --platform=managed
      - --image=${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}
      - --region=${_DEPLOY_REGION}
      - --quiet

images:
  - ${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
