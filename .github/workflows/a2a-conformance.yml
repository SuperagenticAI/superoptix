name: A2A Conformance

# Runs the official A2A Technology Compatibility Kit against the public A2A
# endpoint and publishes the compatibility report as a build artifact.
#
# The job enforces a floor at each RFC 2119 level. Every level is executed,
# because the compatibility report treats a level it did not run as fully
# compliant, which would turn a real regression into a green build.
on:
  push:
    branches: [ main ]
    paths:
      - 'superoptix/protocols/**'
      - 'superoptix/runtime/**'
      - '.github/workflows/a2a-conformance.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'superoptix/protocols/**'
      - 'superoptix/runtime/**'
      - '.github/workflows/a2a-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MIN_MUST_COMPLIANCE: "100.0"
  MIN_SHOULD_COMPLIANCE: "100.0"
  MIN_MAY_COMPLIANCE: "100.0"

jobs:
  tck:
    name: A2A TCK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Install SuperOptiX with A2A support
        run: uv venv && uv pip install ".[a2a]"

      # Conformance runs against the TCK SUT harness, not the published
      # endpoint. The TCK drives protocol states through magic messageId
      # prefixes; a production agent must not honour those, so the hooks live
      # in a separate app that shares the same server implementation.
      - name: Start the TCK SUT harness
        env:
          SUPEROPTIX_A2A_SUT_URL: http://127.0.0.1:8000
          SUPEROPTIX_TELEMETRY: "false"
        run: |
          uv run --no-project uvicorn superoptix.protocols.a2a.tck_sut:app \
            --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/.well-known/agent-card.json > /dev/null; then
              echo "endpoint up"; exit 0
            fi
            sleep 1
          done
          echo "endpoint failed to start"; cat server.log; exit 1

      - name: Install the A2A TCK
        run: |
          git clone --depth 1 https://github.com/a2aproject/a2a-tck.git "$RUNNER_TEMP/a2a-tck"
          cd "$RUNNER_TEMP/a2a-tck"
          uv venv
          uv pip install --python .venv/bin/python -e .

      - name: Run the conformance suite
        working-directory: ${{ runner.temp }}/a2a-tck
        run: |
          for level in must should may; do
            echo "::group::TCK $level"
            .venv/bin/python run_tck.py --sut-host http://127.0.0.1:8000 --level "$level" || true
            cp reports/compatibility.json "reports/compatibility-$level.json"
            echo "::endgroup::"
          done
          cp -r reports "$GITHUB_WORKSPACE/tck-reports"

      - name: Check the compliance floors
        run: |
          python - <<'PY'
          import json, os, sys

          # Each level is read from its own run. A level that was deselected is
          # reported as 100% compliant, so the must run cannot speak for should.
          levels = ("must", "should", "may")
          floors = {lv: float(os.environ[f"MIN_{lv.upper()}_COMPLIANCE"]) for lv in levels}
          actual = {}
          for lv in levels:
              summary = json.load(open(f"tck-reports/compatibility-{lv}.json"))["summary"]
              actual[lv] = float(summary[f"{lv}_compatibility"].rstrip("%"))

          rows = "\n".join(
              f"| {lv.upper()} | {actual[lv]}% | {floors[lv]}% |" for lv in levels
          )
          print(rows)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("## A2A conformance\n\n")
              fh.write("| Level | Compliance | Floor |\n|---|---|---|\n")
              fh.write(rows + "\n")

          failures = [
              f"{lv.upper()} regressed: {actual[lv]}% < {floors[lv]}%"
              for lv in levels
              if actual[lv] < floors[lv]
          ]
          if failures:
              sys.exit("; ".join(failures))
          PY

      - name: Publish the compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2a-compatibility-report
          path: tck-reports/
          retention-days: 30
