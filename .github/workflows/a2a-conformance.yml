name: A2A Conformance

# Runs the official A2A Technology Compatibility Kit against the TCK SUT
# harness and publishes the compatibility report as a build artifact.
#
# This runs on demand rather than on every push.
#
# The TCK's headline percentage counts requirements it cannot exercise against
# this endpoint as non-compliant (upstream a2aproject/a2a-tck cf4985b). 25 such
# requirements exist here: authentication and TLS, Agent Card JWS signatures,
# cross-binding equivalence, version negotiation probes and the gRPC binding.
# None are failures, and none can be exercised without implementing those
# features, so a percentage floor would gate the build on work that is not
# scheduled.
#
# What the job still answers is the question that matters: does anything the
# TCK does exercise now fail? The check below is a zero-failure gate, not a
# percentage floor.
on:
  workflow_dispatch:

permissions:
  contents: read



jobs:
  tck:
    name: A2A TCK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Install SuperOptiX with A2A support
        run: uv venv && uv pip install ".[a2a]"

      # Conformance runs against the TCK SUT harness, not the published
      # endpoint. The TCK drives protocol states through magic messageId
      # prefixes; a production agent must not honour those, so the hooks live
      # in a separate app that shares the same server implementation.
      - name: Start the TCK SUT harness
        env:
          SUPEROPTIX_A2A_SUT_URL: http://127.0.0.1:8000
          SUPEROPTIX_TELEMETRY: "false"
        run: |
          uv run --no-project uvicorn superoptix.protocols.a2a.tck_sut:app \
            --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/.well-known/agent-card.json > /dev/null; then
              echo "endpoint up"; exit 0
            fi
            sleep 1
          done
          echo "endpoint failed to start"; cat server.log; exit 1

      - name: Install the A2A TCK
        run: |
          git clone --depth 1 https://github.com/a2aproject/a2a-tck.git "$RUNNER_TEMP/a2a-tck"
          cd "$RUNNER_TEMP/a2a-tck"
          uv venv
          uv pip install --python .venv/bin/python -e .

      - name: Run the conformance suite
        working-directory: ${{ runner.temp }}/a2a-tck
        run: |
          for level in must should may; do
            echo "::group::TCK $level"
            .venv/bin/python run_tck.py --sut-host http://127.0.0.1:8000 --level "$level" || true
            cp reports/compatibility.json "reports/compatibility-$level.json"
            echo "::endgroup::"
          done
          cp -r reports "$GITHUB_WORKSPACE/tck-reports"

      - name: Check for conformance failures
        run: |
          python - <<'PY'
          import json, os, sys

          # A percentage floor is the wrong gate here: the TCK counts
          # requirements it cannot exercise as non-compliant, and 25 of those
          # exist for this endpoint. What matters is whether anything it does
          # exercise fails.
          levels = ("must", "should", "may")
          rows, failures = [], []

          for lv in levels:
              report = json.load(open(f"tck-reports/compatibility-{lv}.json"))
              per = report["per_requirement"]
              of_level = {k: v for k, v in per.items() if v["level"] == lv.upper()}
              passed = [k for k, v in of_level.items() if v["status"] == "PASS"]
              failed = [k for k, v in of_level.items() if v["status"] == "FAIL"]
              untested = [k for k, v in of_level.items() if v["status"] == "NOT TESTED"]
              exercised = len(passed) + len(failed)
              pct = (100.0 * len(passed) / exercised) if exercised else 100.0
              rows.append(
                  f"| {lv.upper()} | {len(passed)}/{exercised} | {pct:.1f}% | "
                  f"{len(untested)} | {report['summary'][lv + '_compatibility']} |"
              )
              failures += [f"{lv.upper()}: {k}" for k in failed]

          table = (
              "| Level | Passed / exercised | Rate | Not exercised | TCK headline |\n"
              "|---|---|---|---|---|\n" + "\n".join(rows)
          )
          print(table)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("## A2A conformance\n\n" + table + "\n")

          if failures:
              sys.exit("Conformance failures:\n  " + "\n  ".join(failures))
          print("\nNo conformance failures.")
          PY

      - name: Publish the compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2a-compatibility-report
          path: tck-reports/
          retention-days: 30
