    # crewai excluded: requires chromadb~=1.1.0 vs our >=1.5.5.
    # Install separately: uv pip install superoptix "crewai>=1.15"
    # Protocol integrations (A2A v1 is implemented directly over FastAPI)
    "sse-starlette",
    # logfire - EXCLUDED (conflicts with google-adk's opentelemetry-sdk version)
    # Existing dependencies
    "streamlit",
    "plotly",
