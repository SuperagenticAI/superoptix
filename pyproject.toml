[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "superoptix"
version = "0.3.2"
description = "Agent-to-agent communication, without framework lock-in. Make the agents you already run callable by any other agent, and get them discovered. Adapts existing DSPy, CrewAI, OpenAI Agents SDK, Pydantic AI, Google ADK, Claude Agent SDK, DeepAgents and Microsoft agents to A2A 1.0 without rewriting them."
authors = [
    {name = "Superagentic AI", email = "hello@super-agentic.ai"},
    {name = "Shashi Jagtap", email = "shashikant.jagtap@icloud.com"},
    {name = "Shashi Jagtap", email = "shashi@super-agentic.ai"},
]
maintainers = [
    {name = "Superagentic AI", email = "hello@super-agentic.ai"},
]
license = {file = "LICENCE"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["ai", "agents", "dspy", "orchestration", "multi-agent", "autonomous", "artificial-intelligence", "machine-learning", "llm", "framework", "optimization", "evaluation", "rag", "memory", "observability", "prompt-engineering", "bdd", "testing", "superspec", "dspy-ai", "agent-framework", "ai-agents", "llm-framework", "prompt-optimization", "context-engineering", "agent-orchestration", "ai-development", "agent-development", "llm-optimization", "ai-testing", "agent-testing", "vector-database", "semantic-search", "ai-memory", "agent-memory", "ai-observability", "agent-observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]

# Core dependencies - minimal installation for CLI and basic functionality
# NOTE: DSPy included for v0.2.0 since GEPA depends on it. Future versions will make it optional.
# NOTE: MCP included since Super CLI acts as MCP client for tool usage and knowledge access
dependencies = [
    "colorama",
    "pyyaml",
    "numpy",
    "rich",
    "typer",
    "jinja2",
    "requests",
    # NOTE: torch / transformers / accelerate are NOT core dependencies.
    # Only superoptix/models/backends/huggingface*.py imports them, always
    # lazily, and they are already declared in the `huggingface` and
    # `ml-cross-platform` extras. Keeping them here added ~545 MB to every
    # install (torch alone is 491 MB) for an optional local-inference backend.
    #   uv pip install "superoptix[huggingface]"   # to use that backend
    "dspy>=3.3",  # GEPA lives in DSPy 3.x - floor prevents silent back-solve to 2.6.x
    "litellm>=1.98,!=1.82.7,!=1.82.8",  # Block compromised March 2026 releases
    "pydantic",  # Required for data validation
    "python-dotenv",  # Required for environment variables
    "mcp",  # Required for Super CLI MCP client functionality
]

[project.optional-dependencies]
# ============================================================================
# FRAMEWORK INTEGRATIONS - Multi-Framework Support (NEW in 0.2.0)
# ============================================================================

# DSPy - kept as a separate extra so it can be pinned independently
frameworks-dspy = [
    "dspy>=3.3",  # PyPI package name
]

# OpenAI Agents SDK
# NOTE: capped at <0.21 - openai-agents 0.22+ requires openai>=3.0, while
# litellm (a DSPy dependency) still requires openai<3.0. Lift the cap once
# litellm ships openai v3 support.
frameworks-openai = [
    "openai-agents>=0.20,<0.21",
    "openai>=2.54,<3",
]

# Google ADK (Agent Development Kit)
# ADK 2.x is a graph-based Workflow Runtime (BaseAgent now subclasses BaseNode).
# SuperOptiX only uses Agent / Runner / InMemoryRunner, which are unchanged.
# google-generativeai is deprecated upstream and unused here - use google-genai.
frameworks-google = [
    "google-adk>=2.7",
]

# Microsoft Agent Framework (1.0 GA shipped 2026-04-03)
# NOTE: agent-framework caps mcp<2, which holds the whole graph on mcp 1.x.
frameworks-microsoft = [
    "agent-framework>=1.16",
    "azure-identity",
]

# DeepAgents (LangChain) - 0.5.6+ with pluggable backends
frameworks-deepagents = [
    "deepagents>=0.7,<0.8",  # 0.7.x backend abstraction; used via create_deep_agent
]

# Pydantic AI - Type-safe agent framework (full package)
# Upstream repo: https://github.com/pydantic/pydantic-ai
# NOTE: capped at <2.32 - pydantic-ai 2.36 requires opentelemetry-api==1.44,
# while google-adk 2.x requires opentelemetry-api<=1.42.1. Lift when ADK moves.
frameworks-pydantic-ai = [
    "pydantic-ai>=2.31,<2.32",
]

# Claude Agent SDK
frameworks-claude-sdk = [
    "claude-agent-sdk>=0.2",
]

# CrewAI - installed alongside SuperOptiX rather than as an extra.
#
# The historically documented blocker (json-repair) is RESOLVED upstream:
# crewai 1.15+ requires json-repair~=0.60.1, which satisfies DSPy 3.3's
# json-repair>=0.30. CrewAI and DSPy now co-install cleanly.
#
# The live blocker is chromadb: crewai 1.15+ requires chromadb~=1.1.0, while
# the chromadb / turboagents / vectordb extras require chromadb>=1.5.5.
# Declaring that as a [tool.uv] conflict pushes `uv lock` past 10 minutes,
# so CrewAI stays a one-line install instead:
#
#   uv pip install superoptix "crewai>=1.15"
#
# Use a CrewAI-only environment (no turboagents/vectordb extras) for that path.

# All frameworks except CrewAI (see the CrewAI chromadb note above).
# Keep these bounds in sync with the individual frameworks-* extras above.
frameworks = [
    "dspy>=3.3",
    "openai-agents>=0.20,<0.21",
    "openai>=2.54,<3",
    "google-adk>=2.7",
    "agent-framework>=1.16",
    "azure-identity",
    "deepagents>=0.7,<0.8",
    "pydantic-ai>=2.31,<2.32",
    "claude-agent-sdk>=0.2",
    # crewai excluded: requires chromadb~=1.1.0 vs our >=1.5.5.
    # Install separately: uv pip install superoptix "crewai>=1.15"
]

# MCP tool optimization (vendored from GEPA PR #105)
mcp = [
    "mcp",
]

# A2A protocol support.
# NOTE: superoptix implements A2A v1 directly over FastAPI (superoptix/protocols/a2a/);
# the a2a-sdk package is not imported anywhere, so it is no longer declared here.
# It previously supplied fastapi/starlette transitively via its [http-server] extra,
# which these explicit deps now replace. If the implementation is migrated onto the
# official SDK, add "a2a-sdk>=1.1" (the v1 spec line) rather than the 0.3.x pin.
a2a = [
    "fastapi>=0.115.2",
    "sse-starlette",
    "uvicorn>=0.35.0",
]

# Backward-compatible alias while integrations settle
protocols-a2a = [
    "fastapi>=0.115.2",
    "sse-starlette",
    "uvicorn>=0.35.0",
]

# LogFire observability for Pydantic AI
# Note: Separate from frameworks-pydantic-ai to avoid dependency conflicts with google-adk
# LogFire requires opentelemetry-sdk>=1.39.0 while google-adk requires opentelemetry-sdk==1.37.0
logfire = [
    "logfire",
]

# Phoenix observability via OpenTelemetry/OpenInference
phoenix = [
    "arize-phoenix-otel>=0.15.0",
    "openinference-instrumentation>=0.1.44",
    "openinference-instrumentation-crewai",
    "openinference-instrumentation-dspy",
    "openinference-instrumentation-google-adk",
    "openinference-instrumentation-openai",
    "openinference-instrumentation-openai-agents",
    "openinference-instrumentation-pydantic-ai",
]

# ============================================================================
# EXISTING OPTIONAL DEPENDENCIES
# ============================================================================

# Note: see the CrewAI note in the frameworks section for its chromadb constraint.

# Development dependencies
dev = [
    "pytest",
    "black",
    "ruff",
    "pre-commit",
    "mypy",
    "pytest-cov",
    "pytest-asyncio",
]

# Optimas integration (optional) - DISABLED for 0.2.0b1
# Optimas has additional dependencies that may conflict with framework integrations
# Will be re-enabled in a future release
# optimas = [
#     "optimas-ai==0.0.4",
#     "openai",
#     "autogen-agentchat>=0.2,<1.0",
#     "autogen-ext>=0.2,<1.0",
# ]
#
# # Target-specific extras (install only what you need)
# optimas-openai = [
#     "openai",
# ]
# optimas-autogen = [
#     "autogen-agentchat>=0.2,<1.0",
#     "autogen-ext>=0.2,<1.0",
# ]

# UI and visualization dependencies
ui = [
    "streamlit",
    "plotly",
    "pandas",
]

# Vector database dependencies
chromadb = [
    "chromadb>=1.5.5",
    "sentence-transformers",
]

lancedb = [
    "lancedb",
    "sentence-transformers",
]

faiss = [
    "faiss-cpu",
    "sentence-transformers",
]

turboagents = [
    "turboagents[rag]>=0.1.0a2",
    "chromadb>=1.5.5",
    "sentence-transformers",
]

weaviate = [
    "weaviate-client",
    "sentence-transformers",
]

qdrant = [
    "qdrant-client",
    "sentence-transformers",
]

milvus = [
    "pymilvus",
    "sentence-transformers",
]

surrealdb = [
    "surrealdb",
    "sentence-transformers",
]

# All vector databases
vectordb = [
    "chromadb>=1.5.5",
    "lancedb",
    "faiss-cpu",
    "weaviate-client",
    "qdrant-client",
    "pymilvus",
    "surrealdb",
    "turboagents[rag]>=0.1.0a2",
    "sentence-transformers",
]

# Local model management dependencies (Apple Silicon only)
mlx = [
    "mlx-lm",
]

# Cross-platform ML dependencies (excludes Apple Silicon specific packages)
ml-cross-platform = [
    "transformers",
    "torch",
    "huggingface-hub",
]

huggingface = [
    "transformers",
    "torch",
    "accelerate",
    "fastapi",
    "huggingface-hub",
    "uvicorn",
]

# Memory and caching dependencies
redis = [
    "redis",
]

# Observability and monitoring dependencies
observability = [
    "mlflow",
    "langfuse",
    "pandas",
    "plotly",
]

# Web framework dependencies
web = [
    "fastapi",
    "uvicorn",
    "pydantic",
]

# Data processing dependencies (for future use / upper tiers)
data = [
    # Future ML, plotting, and statistical visualization features
]

# Cloud and deployment dependencies (for future use / upper tiers)
cloud = [
    # Future AWS, Azure, GCP, Kubernetes, and Docker integrations
]

# Testing and evaluation dependencies
testing = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "responses",
]

# Documentation dependencies
docs = [
    "mkdocs",
    "mkdocs-material",
    "pymdown-extensions",
    "mkdocs-mermaid2-plugin",
]

# All optional dependencies (excluding dev, Apple Silicon specific, CrewAI, and LogFire)
# NOTE: Includes DSPy. CrewAI is a separate extra (chromadb version conflict).
