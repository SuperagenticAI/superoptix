# Cloud Run service definition for the public SuperOptiX A2A endpoint.
#
# Deploy with:
#   gcloud run services replace deploy/a2a/service.yaml --region europe-west1
#
# Or skip this file entirely and use the source deploy in README.md, which
# builds and deploys in one command.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: superoptix-a2a
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Scale to zero. A Python container starts in one to two seconds, which
        # is inside the timeout an A2A client allows, so the free tier is usable
        # here. Raise to "1" if real traffic makes the first-call latency matter.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "4"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 120
      containers:
        - image: gcr.io/PROJECT_ID/superoptix-a2a:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            # Must match the address the card advertises, or callers are sent
            # somewhere that does not answer.
            - name: SUPEROPTIX_A2A_PUBLIC_URL
              value: https://a2a.superoptix.ai
            - name: SUPEROPTIX_TELEMETRY
              value: "false"
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /.well-known/agent-card.json
            initialDelaySeconds: 0
            periodSeconds: 3
            failureThreshold: 10
