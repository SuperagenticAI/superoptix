# Deprecated. The public endpoint runs on Cloud Run at a2a.superoptix.ai.
# Kept only as a rollback blueprint. Do not deploy this as the live service.
#
# The service exposes only the deterministic catalogue skills, so it needs no
# model provider keys and no persistent storage.
services:
  - type: web
    name: superoptix-a2a
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install ".[a2a]"
    startCommand: uvicorn superoptix.protocols.a2a.public.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /.well-known/agent-card.json
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Must match the public URL Render assigns, or the card will advertise an
      # address callers cannot reach.
      - key: SUPEROPTIX_A2A_PUBLIC_URL
        value: https://a2a.superoptix.ai
      - key: SUPEROPTIX_TELEMETRY
        value: "false"
